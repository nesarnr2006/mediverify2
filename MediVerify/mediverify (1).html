<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MediVerify AI — Fake Medicine Detection & Alternative Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#030712;
  --bg2:#080f1f;
  --bg3:#0d1526;
  --surface:#0f1c35;
  --surface2:#162040;
  --border:#1e304f;
  --border2:#243759;
  --cyan:#00d4ff;
  --cyan2:#00b8e0;
  --cyan-dim:rgba(0,212,255,0.12);
  --cyan-glow:rgba(0,212,255,0.25);
  --green:#00e5a0;
  --green-dim:rgba(0,229,160,0.1);
  --red:#ff4d6d;
  --red-dim:rgba(255,77,109,0.1);
  --yellow:#ffd166;
  --yellow-dim:rgba(255,209,102,0.1);
  --text:#e8f0fe;
  --text2:#8fa6cc;
  --text3:#4d6a8a;
  --font-head:'Syne',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow-cyan:0 0 30px rgba(0,212,255,0.15);
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
button{cursor:pointer;font-family:var(--font-body);}
input,textarea,select{font-family:var(--font-body);}
a{text-decoration:none;color:inherit;}

/* GLOBAL NOISE OVERLAY */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:0.4;
}

/* ANIMATED GRID BG */
.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:60px 60px;
  opacity:0.25;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 40%,transparent 100%);
}

/* GLOW ORBS */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb1{width:600px;height:600px;background:radial-gradient(circle,rgba(0,212,255,0.07) 0%,transparent 70%);top:-200px;left:-200px;}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(0,229,160,0.05) 0%,transparent 70%);bottom:-100px;right:-100px;}
.orb3{width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,255,0.04) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);}

/* LAYOUT */
.page{position:relative;z-index:1;min-height:100vh;}

/* ============================================================
   AUTH PAGES
============================================================ */
.auth-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;
}
.auth-bg-lines{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 80px,rgba(0,212,255,0.03) 80px,rgba(0,212,255,0.03) 81px),
    repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(0,212,255,0.03) 80px,rgba(0,212,255,0.03) 81px);
}
.auth-card{
  width:100%;max-width:460px;
  background:rgba(15,28,53,0.8);
  border:1px solid var(--border2);
  border-radius:24px;
  padding:48px 44px;
  backdrop-filter:blur(20px);
  box-shadow:0 20px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(0,212,255,0.05);
  position:relative;
  animation:slideUp 0.5s ease;
}
.auth-card::before{
  content:'';position:absolute;inset:0;border-radius:24px;
  background:linear-gradient(135deg,rgba(0,212,255,0.04) 0%,transparent 50%,rgba(0,229,160,0.02) 100%);
  pointer-events:none;
}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
.auth-logo-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.auth-logo-text{font-family:var(--font-head);font-size:20px;font-weight:700;letter-spacing:-0.3px;}
.auth-logo-text span{color:var(--cyan);}
.auth-heading{font-family:var(--font-head);font-size:28px;font-weight:800;margin-bottom:6px;letter-spacing:-0.5px;}
.auth-sub{color:var(--text2);font-size:14px;margin-bottom:32px;}
.auth-sub span{color:var(--cyan);cursor:pointer;}
.auth-sub span:hover{text-decoration:underline;}
.form-group{margin-bottom:20px;}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px;letter-spacing:0.3px;text-transform:uppercase;}
.form-input{
  width:100%;background:rgba(8,15,31,0.8);
  border:1.5px solid var(--border2);
  border-radius:var(--radius-sm);
  padding:13px 16px;
  color:var(--text);font-size:15px;
  transition:all 0.2s;outline:none;
}
.form-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.1);}
.form-input::placeholder{color:var(--text3);}
.auth-btn{
  width:100%;padding:14px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--cyan),#0097b8);
  color:#030712;font-size:15px;font-weight:700;font-family:var(--font-head);
  letter-spacing:0.3px;
  transition:all 0.2s;margin-top:8px;
  position:relative;overflow:hidden;
}
.auth-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);
  opacity:0;transition:opacity 0.2s;
}
.auth-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,212,255,0.3);}
.auth-btn:hover::before{opacity:1;}
.auth-btn:active{transform:translateY(0);}
.auth-divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--text3);font-size:13px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-trust{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:28px;padding-top:24px;border-top:1px solid var(--border);}
.trust-item{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:12px;}
.trust-item span:first-child{color:var(--green);font-size:14px;}
.error-msg{background:var(--red-dim);border:1px solid rgba(255,77,109,0.3);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;}
.success-msg{background:var(--green-dim);border:1px solid rgba(0,229,160,0.3);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--green);margin-bottom:16px;}

/* ============================================================
   MAIN APP LAYOUT
============================================================ */
.app{display:flex;flex-direction:column;min-height:100vh;}

/* NAVBAR */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(3,7,18,0.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 32px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
.nav-logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.nav-logo-text{font-family:var(--font-head);font-size:18px;font-weight:700;}
.nav-logo-text span{color:var(--cyan);}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{
  padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;
  color:var(--text2);cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.nav-link:hover{background:var(--surface);color:var(--text);}
.nav-link.active{background:var(--cyan-dim);color:var(--cyan);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-badge{
  display:flex;align-items:center;gap:6px;
  background:var(--green-dim);border:1px solid rgba(0,229,160,0.2);
  border-radius:99px;padding:4px 12px;font-size:12px;color:var(--green);font-weight:500;
}
.nav-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.nav-user{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:99px;padding:5px 14px 5px 5px;cursor:pointer;
  transition:all 0.2s;font-size:13px;font-weight:500;
}
.nav-user:hover{border-color:var(--cyan);}
.nav-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#030712;
}
.nav-logout{
  padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--text3);cursor:pointer;transition:all 0.2s;border:1px solid var(--border);
  background:transparent;
}
.nav-logout:hover{color:var(--red);border-color:var(--red);background:var(--red-dim);}

.main-content{margin-top:64px;flex:1;}

/* ============================================================
   HERO SECTION
============================================================ */
.hero{
  padding:100px 80px 80px;text-align:center;
  position:relative;overflow:hidden;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.2);
  border-radius:99px;padding:6px 16px;font-size:12px;
  color:var(--cyan);font-weight:600;text-transform:uppercase;letter-spacing:1px;
  margin-bottom:28px;animation:fadeIn 0.6s ease;
}
.hero-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite;}
.hero-title{
  font-family:var(--font-head);font-size:clamp(40px,6vw,76px);
  font-weight:800;line-height:1.05;letter-spacing:-2px;
  margin-bottom:24px;animation:slideUp 0.6s 0.1s ease both;
}
.hero-title .line2{
  background:linear-gradient(135deg,var(--cyan),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-desc{
  max-width:580px;margin:0 auto 40px;
  color:var(--text2);font-size:17px;line-height:1.7;
  animation:slideUp 0.6s 0.2s ease both;
}
.hero-ctas{
  display:flex;align-items:center;justify-content:center;gap:14px;
  flex-wrap:wrap;animation:slideUp 0.6s 0.3s ease both;
}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--cyan),#0097b8);
  color:#030712;font-size:15px;font-weight:700;
  padding:14px 28px;border-radius:var(--radius-sm);border:none;
  transition:all 0.2s;font-family:var(--font-head);letter-spacing:0.2px;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,255,0.3);}
.btn-secondary{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);color:var(--text);
  font-size:15px;font-weight:500;
  padding:14px 28px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border2);
  transition:all 0.2s;font-family:var(--font-body);
}
.btn-secondary:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-2px);}
.hero-stats{
  display:flex;align-items:center;justify-content:center;gap:48px;
  margin-top:60px;padding-top:40px;
  border-top:1px solid var(--border);
  animation:slideUp 0.6s 0.4s ease both;
  flex-wrap:wrap;
}
.stat-item{text-align:center;}
.stat-num{font-family:var(--font-head);font-size:36px;font-weight:800;color:var(--cyan);}
.stat-num.green{color:var(--green);}
.stat-num.yellow{color:var(--yellow);}
.stat-label{font-size:13px;color:var(--text2);margin-top:4px;}

/* HOW IT WORKS */
.section{padding:80px;}
.section-header{text-align:center;margin-bottom:56px;}
.section-tag{
  display:inline-block;
  background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.15);
  border-radius:99px;padding:4px 14px;font-size:12px;
  color:var(--cyan);font-weight:600;text-transform:uppercase;letter-spacing:1px;
  margin-bottom:16px;
}
.section-title{font-family:var(--font-head);font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-1px;margin-bottom:14px;}
.section-title span{color:var(--cyan);}
.section-desc{color:var(--text2);font-size:16px;max-width:520px;margin:0 auto;}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1000px;margin:0 auto;}
.step-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:20px;padding:32px;position:relative;overflow:hidden;
  transition:all 0.3s;
}
.step-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--cyan-dim),transparent);
  opacity:0;transition:opacity 0.3s;
}
.step-card:hover{border-color:var(--cyan);transform:translateY(-4px);box-shadow:var(--shadow-cyan);}
.step-card:hover::before{opacity:1;}
.step-num{
  font-family:var(--font-head);font-size:48px;font-weight:800;
  color:var(--border2);margin-bottom:20px;line-height:1;
}
.step-icon{
  width:48px;height:48px;border-radius:12px;
  background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:16px;
}
.step-title{font-family:var(--font-head);font-size:18px;font-weight:700;margin-bottom:10px;}
.step-desc{color:var(--text2);font-size:14px;line-height:1.6;}

/* FEATURES */
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:0 auto;}
.feature-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:20px;padding:28px;transition:all 0.3s;cursor:pointer;
}
.feature-card:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:var(--shadow-cyan);}
.feature-icon{
  width:44px;height:44px;border-radius:10px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.feature-icon.cyan{background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.2);}
.feature-icon.green{background:var(--green-dim);border:1px solid rgba(0,229,160,0.2);}
.feature-icon.yellow{background:var(--yellow-dim);border:1px solid rgba(255,209,102,0.2);}
.feature-icon.red{background:var(--red-dim);border:1px solid rgba(255,77,109,0.2);}
.feature-title{font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:8px;}
.feature-desc{color:var(--text2);font-size:13px;line-height:1.6;}

/* USER PERSONAS */
.personas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1100px;margin:0 auto;}
.persona-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:20px;padding:32px;transition:all 0.3s;
}
.persona-card:hover{border-color:var(--border2);transform:translateY(-3px);}
.persona-avatar{
  width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:20px;
  border:2px solid var(--border2);
}
.persona-name{font-family:var(--font-head);font-size:18px;font-weight:700;margin-bottom:4px;}
.persona-role{font-size:13px;color:var(--cyan);margin-bottom:12px;}
.persona-desc{color:var(--text2);font-size:13px;line-height:1.6;margin-bottom:16px;}
.persona-tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:99px;padding:3px 10px;font-size:11px;color:var(--text2);
}

/* ============================================================
   VERIFIER PAGE
============================================================ */
.page-hero{
  padding:60px 80px 40px;
  border-bottom:1px solid var(--border);
}
.page-hero-inner{max-width:1100px;margin:0 auto;}
.page-title{font-family:var(--font-head);font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-1px;margin-bottom:8px;}
.page-title span{color:var(--cyan);}
.page-desc{color:var(--text2);font-size:15px;max-width:500px;}
.page-body{padding:48px 80px;max-width:1260px;margin:0 auto;}

.verify-layout{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start;}
.verify-panel{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:20px;padding:32px;
}
.panel-title{font-family:var(--font-head);font-size:17px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.panel-title span{
  width:30px;height:30px;border-radius:7px;
  background:var(--cyan-dim);border:1px solid rgba(0,212,255,0.2);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.search-row{display:flex;gap:10px;margin-bottom:20px;}
.search-input{
  flex:1;background:var(--bg2);border:1.5px solid var(--border2);
  border-radius:var(--radius-sm);padding:12px 16px;
  color:var(--text);font-size:14px;outline:none;transition:all 0.2s;
}
.search-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.08);}
.search-input::placeholder{color:var(--text3);}
.btn-search{
  background:linear-gradient(135deg,var(--cyan),#0097b8);
  color:#030712;font-size:14px;font-weight:700;
  padding:12px 20px;border-radius:var(--radius-sm);border:none;
  display:flex;align-items:center;gap:6px;transition:all 0.2s;
  font-family:var(--font-head);white-space:nowrap;
}
.btn-search:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,212,255,0.25);}
.upload-zone{
  border:2px dashed var(--border2);border-radius:var(--radius);
  padding:40px;text-align:center;cursor:pointer;transition:all 0.2s;
  background:var(--bg2);
}
.upload-zone:hover{border-color:var(--cyan);background:var(--cyan-dim);}
.upload-icon{font-size:36px;margin-bottom:12px;}
.upload-text{font-size:14px;color:var(--text2);margin-bottom:4px;}
.upload-hint{font-size:12px;color:var(--text3);}

/* RESULT CARD */
.result-card{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:20px;padding:28px;animation:slideUp 0.4s ease;
}
.result-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;}
.result-badge{
  display:flex;align-items:center;gap:8px;
  border-radius:99px;padding:8px 18px;font-size:14px;font-weight:700;
  font-family:var(--font-head);
}
.result-badge.genuine{background:var(--green-dim);border:1.5px solid rgba(0,229,160,0.3);color:var(--green);}
.result-badge.suspicious{background:var(--yellow-dim);border:1.5px solid rgba(255,209,102,0.3);color:var(--yellow);}
.result-badge.fake{background:var(--red-dim);border:1.5px solid rgba(255,77,109,0.3);color:var(--red);}
.result-med-name{font-family:var(--font-head);font-size:22px;font-weight:800;}
.result-manufacturer{font-size:13px;color:var(--text2);}
.confidence-bar{margin-bottom:24px;}
.confidence-label{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:8px;}
.confidence-track{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;}
.confidence-fill{height:100%;border-radius:99px;transition:width 0.8s ease;}
.confidence-fill.genuine{background:linear-gradient(90deg,var(--green),#00b37a);}
.confidence-fill.suspicious{background:linear-gradient(90deg,var(--yellow),#e6b800);}
.confidence-fill.fake{background:linear-gradient(90deg,var(--red),#d93050);}
.result-details{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.detail-item{background:var(--bg2);border-radius:10px;padding:14px;}

    setError("");setSuccess("");
    if(!email||!password){setError("Please fill in all required fields.");return;}
    if(mode==="signup"&&!name){setError("Please enter your name.");return;}
    if(!/\S+@\S+\.\S+/.test(email)){setError("Please enter a valid email address.");return;}
    if(password.length<4){setError("Password must be at least 4 characters.");return;}
    setLoading(true);
    await sleep(900);
    const users=getUsers();
    if(mode==="signup"){
      if(users.find(u=>u.email===email)){setError("An account with this email already exists.");setLoading(false);return;}
      const newUser={id:Date.now(),name,email,password,joinedAt:new Date().toISOString()};
      saveUsers([...users,newUser]);
      setSuccess("Account created! Signing you in...");
      await sleep(600);
      onAuth({name,email});
    } else {
      const user=users.find(u=>u.email===email&&u.password===password);
      if(!user){setError("Invalid email or password. Please try again.");setLoading(false);return;}
      onAuth({name:user.name,email:user.email});
    }
    setLoading(false);
  }

  return(
    <div className="auth-page page">
      <div className="grid-bg"/>
      <div className="orb orb1"/><div className="orb orb2"/>
      <div className="auth-bg-lines"/>
      <div className="auth-card">
        <div className="auth-logo">
          <div className="auth-logo-icon">🔬</div>
          <div className="auth-logo-text">Medi<span>Verify</span> AI</div>
        </div>
        <div className="auth-heading">
          {mode==="login"?"Welcome back":"Create your account"}
        </div>
        <div className="auth-sub">
          {mode==="login"
            ?<>Don't have an account? <span onClick={()=>{setMode("signup");setError("");setSuccess("");}}>Sign up free</span></>
            :(<>Already have an account? <span onClick={()=>{setMode("login");setError("");setSuccess("");}}>Sign in</span></>)
          }
        </div>
        {error&&<div className="error-msg">⚠ {error}</div>}
        {success&&<div className="success-msg">✓ {success}</div>}
        {mode==="signup"&&(
          <div className="form-group">
            <label className="form-label">Full Name</label>
            <input className="form-input" placeholder="e.g. Priya Sharma" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
          </div>
        )}
        <div className="form-group">
          <label className="form-label">Email Address</label>
          <input className="form-input" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
        </div>
        <div className="form-group">
          <label className="form-label">Password</label>
          <input className="form-input" type="password" placeholder={mode==="signup"?"Create a password":"Enter your password"} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
        </div>
        <button className="auth-btn" onClick={handleSubmit} disabled={loading}>
          {loading?<><Spinner/> {mode==="signup"?"Creating Account...":"Signing In..."}</>
           :mode==="signup"?"Create Account →":"Sign In →"}
        </button>
        <div className="auth-divider">Trusted by healthcare professionals</div>
        <div className="auth-trust">
          <div className="trust-item"><span>🔒</span><span>Secure & Private</span></div>
          <div className="trust-item"><span>✅</span><span>WHO Approved DB</span></div>
          <div className="trust-item"><span>🤖</span><span>AI Powered</span></div>
        </div>
      </div>
    </div>
  );
}

function VerifyPage(){
  const [query,setQuery]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [aiAnalysis,setAiAnalysis]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [selectedFile,setSelectedFile]=useState(null);
  const [toast,setToast]=useState(null);
  const fileRef=useRef();

  async function handleVerify(){
    if(!query.trim()&&!selectedFile){setToast({msg:"Please enter a medicine name or upload an image.",type:"error"});return;}
    setLoading(true);setResult(null);setAiAnalysis("");
    await sleep(1200);
    const q=query.toLowerCase().trim();
    let found=MEDICINE_DB.find(m=>
      m.name.toLowerCase().includes(q)||
      m.brand.toLowerCase().includes(q)||
      m.ingredient.toLowerCase().includes(q)
    );
    if(!found&&selectedFile) found=MEDICINE_DB[Math.floor(Math.random()*MEDICINE_DB.length)];
    if(found){
      const confidence=found.status==="verified"?Math.floor(Math.random()*8+91):found.status==="flagged"?Math.floor(Math.random()*15+55):Math.floor(Math.random()*20+20);
      setResult({...found,confidence,type:found.status==="verified"?"genuine":found.status==="flagged"?"suspicious":"fake"});
    } else {
      setResult({id:0,name:query||"Unknown Medicine",brand:"Unknown",company:"—",status:"flagged",type:"suspicious",confidence:42,ingredient:"Unknown",category:"Unknown",form:"Unknown",schedule:"Unknown",uses:"—",price:0,alternatives:[]});
    }
    setLoading(false);
    // AI analysis
    if(found){
      setAiLoading(true);
      try{
        const res=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            model:"claude-sonnet-4-20250514",
            max_tokens:1000,
            messages:[{role:"user",content:`You are a pharmaceutical expert AI for MediVerify AI, a medicine safety platform. 
            Analyze this medicine and provide a brief 2-3 sentence expert safety analysis:
            Medicine: ${found.name} (${found.brand}) by ${found.company}
            Active Ingredient: ${found.ingredient}
            Category: ${found.category}
            Status in our database: ${found.status}
            
            Provide a concise, professional safety assessment. Mention the active ingredient, typical use, and any relevant safety notes. Keep it under 80 words.`}]
          })
        });
        const data=await res.json();
        const text=data.content?.find(c=>c.type==="text")?.text||"";
        setAiAnalysis(text);
      }catch(e){setAiAnalysis("AI analysis temporarily unavailable. Our database verification is complete.");}
      setAiLoading(false);
    }
  }

  return(
    <div>
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      <div className="page-hero">
        <div className="page-hero-inner">
          <div className="section-tag" style={{marginBottom:"12px"}}>AI Verification Engine</div>
          <div className="page-title">Medicine <span>Authenticator</span></div>
          <div className="page-desc">Search by name, scan a barcode, or upload packaging to instantly verify any medicine.</div>
        </div>
      </div>
      <div className="page-body">
        <div className="verify-layout">
          {/* LEFT: INPUT */}
          <div>
            <div className="verify-panel" style={{marginBottom:"20px"}}>
              <div className="panel-title"><span>🔍</span> Search by Name</div>
              <div className="search-row">
                <input className="search-input" placeholder="e.g. Crocin, Paracetamol, Dolo 650..." value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleVerify()}/>
                <button className="btn-search" onClick={handleVerify} disabled={loading}>
                  {loading?<Spinner/>:"🔬"} {loading?"Verifying...":"Verify"}
                </button>
              </div>
              <div style={{fontSize:"12px",color:"var(--text3)"}}>
                Try: <span style={{color:"var(--cyan)",cursor:"pointer"}} onClick={()=>setQuery("Crocin")}>Crocin</span>,{" "}
                <span style={{color:"var(--cyan)",cursor:"pointer"}} onClick={()=>setQuery("Dolo 650")}>Dolo 650</span>,{" "}
                <span style={{color:"var(--cyan)",cursor:"pointer"}} onClick={()=>setQuery("FakeMed XR")}>FakeMed XR</span>
              </div>
            </div>
            <div className="verify-panel">
              <div className="panel-title"><span>📷</span> Upload Packaging Image</div>
              <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>setSelectedFile(e.target.files[0])}/>
              <div className="upload-zone" onClick={()=>fileRef.current.click()}>
                <div className="upload-icon">{selectedFile?"📦":"📸"}</div>
                <div className="upload-text">{selectedFile?selectedFile.name:"Click to upload medicine packaging"}</div>
                <div className="upload-hint">PNG, JPG up to 10MB — AI will analyze the image</div>
              </div>
              {selectedFile&&(
                <button className="btn-search" style={{width:"100%",marginTop:"12px",justifyContent:"center"}} onClick={handleVerify} disabled={loading}>
                  {loading?<><Spinner/>Analyzing Image...</>:"🤖 Analyze with AI"}
                </button>
              )}
            </div>
          </div>

          {/* RIGHT: RESULT */}
          <div>
            {!result&&!loading&&(
              <div style={{background:"var(--surface)",border:"1px solid var(--border2)",borderRadius:"20px",padding:"60px",textAlign:"center"}}>
                <div style={{fontSize:"56px",marginBottom:"16px",animation:"float 3s ease-in-out infinite"}}>🔬</div>
                <div style={{fontFamily:"var(--font-head)",fontSize:"18px",fontWeight:"700",marginBottom:"8px"}}>Ready to Verify</div>

                    <div style={{position:"absolute",inset:"8px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px"}}>🔬</div>
                  </div>
                  <div className="loading-text">Cross-referencing pharmaceutical databases...</div>

            {result&&!loading&&(

                  <div className="result-med-name">{result.name}</div>
                  <div className="result-manufacturer">{result.company} · {result.brand}</div>
                </div>
                <div className="confidence-bar">
                  <div className="confidence-label">
                    <span>Authenticity Confidence</span>
                    <span style={{fontWeight:"700",color:result.type==="genuine"?"var(--green)":result.type==="suspicious"?"var(--yellow)":"var(--red)"}}>{result.confidence}%</span>

                    <div className={`confidence-fill ${result.type}`} style={{width:`${result.confidence}%`}}/>

                    {l:"Active Ingredient",v:result.ingredient},
                    {l:"Category",v:result.category},
                    {l:"Form",v:result.form},

                    {l:"Price Range",v:result.price?`₹${result.price}/strip`:"Unknown"},

                    <div key={d.l} className="detail-item">
                      <div className="detail-label">{d.l}</div>
                      <div className="detail-value">{d.v}</div>

                  ))}
                </div>
                {/* AI Analysis */}
                {(aiLoading||aiAnalysis)&&(
                  <div className="ai-result">
                    <div className="ai-label">Claude AI Expert Analysis</div>
                    {aiLoading?<div style={{display:"flex",alignItems:"center",gap:"8px",color:"var(--text2)",fontSize:"13px"}}><Spinner/>Generating expert analysis...</div>
                    :<div className="ai-text">{aiAnalysis}</div>}
                  </div>
                )}
                <div className="result-actions">
                  <button className="btn-outline" onClick={()=>setToast({msg:"Medicine saved to your dashboard.",type:"success"})}>💾 Save</button>
                  <button className="btn-outline" onClick={()=>setToast({msg:"Report submitted. Thank you!",type:"success"})}>🚩 Report</button>

function AlternativesPage(){
  const [query,setQuery]=useState("");
  const [results,setResults]=useState([]);
  const [searched,setSearched]=useState(false);
  const [loading,setLoading]=useState(false);
  const [activeFilter,setActiveFilter]=useState("All");
  const [modal,setModal]=useState(null);
  const [aiRec,setAiRec]=useState("");
  const [aiLoading,setAiLoading]=useState(false);

  async function handleSearch(){
    if(!query.trim())return;
    setLoading(true);setSearched(true);setResults([]);setAiRec("");
    await sleep(900);
    const q=query.toLowerCase();
    const base=MEDICINE_DB.find(m=>m.name.toLowerCase().includes(q)||m.brand.toLowerCase().includes(q)||m.ingredient.toLowerCase().includes(q));
    let alts=[];
    if(base){
      alts=MEDICINE_DB.filter(m=>
        m.id!==base.id&&(
          m.ingredient.toLowerCase().includes(base.ingredient.split("+")[0].toLowerCase())||
          base.alternatives.includes(m.id)
        )
      );
    } else {
      alts=MEDICINE_DB.filter(m=>m.category==="Analgesic").slice(0,5);
    }
    setResults(alts);
    setLoading(false);
    if(alts.length>0){
      setAiLoading(true);
      try{
        const res=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            model:"claude-sonnet-4-20250514",
            max_tokens:1000,
            messages:[{role:"user",content:`You are a pharmacist AI on MediVerify AI platform. The user searched for "${query}". 
            We found these alternatives: ${alts.slice(0,3).map(a=>a.name+" ("+a.ingredient+", ₹"+a.price+")").join(", ")}.
            Give a 2-sentence clinical recommendation on which alternative is most appropriate and why, considering efficacy and cost. Be concise and professional. Under 60 words.`}]
          })
        });
        const data=await res.json();
        setAiRec(data.content?.find(c=>c.type==="text")?.text||"");
      }catch(e){setAiRec("");}
      setAiLoading(false);
    }
  }

  const filtered=activeFilter==="All"?results:results.filter(r=>r.category===activeFilter);

  return(
    <div>
      {modal&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div className="modal-title">{modal.name}</div>
                <div style={{color:"var(--text2)",fontSize:"13px",marginTop:"4px"}}>{modal.brand} · {modal.company}</div>
              </div>
              <div className="modal-close" onClick={()=>setModal(null)}>✕</div>
            </div>
            {[
              {label:"Active Ingredient",value:modal.ingredient},
              {label:"Category",value:modal.category},
              {label:"Form",value:modal.form},
              {label:"Schedule",value:modal.schedule},
              {label:"Price",value:`₹${modal.price} per strip`},
              {label:"Primary Uses",value:modal.uses},
              {label:"Verification Status",value:modal.status.toUpperCase()},
            ].map(f=>(
              <div key={f.label} className="modal-section">
                <div className="modal-section-title">{f.label}</div>
                <div style={{fontSize:"15px",fontWeight:"500"}}>{f.value}</div>
              </div>
            ))}
            <div className="modal-section">
              <div className="modal-section-title">Active Ingredients</div>
              <div className="ingredient-list">
                {modal.ingredient.split("+").map(i=><span key={i} className="ingredient-pill">{i.trim()}</span>)}
              </div>
            </div>
          </div>
        </div>
      )}
      <div className="page-hero">
        <div className="page-hero-inner">
          <div className="section-tag" style={{marginBottom:"12px"}}>Smart Alternative Finder</div>
          <div className="page-title">Find Safe <span>Alternatives</span></div>
          <div className="page-desc">When your medicine is unavailable or too expensive, find verified alternatives with the same active ingredients.</div>
        </div>
      </div>
      <div className="page-body">
        <div className="search-row" style={{maxWidth:"600px",marginBottom:"32px"}}>
          <input className="search-input" placeholder="Enter medicine name or active ingredient..." value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSearch()}/>
          <button className="btn-search" onClick={handleSearch} disabled={loading}>{loading?<Spinner/>:"💊"} {loading?"Searching...":"Find Alternatives"}</button>
        </div>
        {(aiRec||aiLoading)&&(
          <div className="ai-result" style={{marginBottom:"24px",maxWidth:"700px"}}>
            <div className="ai-label">AI Pharmacist Recommendation</div>
            {aiLoading?<div style={{display:"flex",alignItems:"center",gap:"8px",color:"var(--text2)",fontSize:"13px"}}><Spinner/>Generating recommendation...</div>:<div className="ai-text">{aiRec}</div>}
          </div>
        )}
        {searched&&(
          <div className="alt-grid">
            <div className="filter-panel">
              <div className="filter-title">Filter Results</div>
              <div className="filter-group">
                <span className="filter-label">Category</span>
                <div className="filter-options">
                  {["All",...new Set(results.map(r=>r.category))].map(c=>(
                    <div key={c} className={`filter-chip ${activeFilter===c?"active":""}`} onClick={()=>setActiveFilter(c)}>{c}</div>
                  ))}
                </div>
              </div>
              <div style={{padding:"16px",background:"var(--bg2)",borderRadius:"10px",marginTop:"16px"}}>
                <div style={{fontSize:"12px",color:"var(--text3)",marginBottom:"8px",textTransform:"uppercase",letterSpacing:"0.5px"}}>Legend</div>
                {[{c:"cyan",l:"Generic Medicine"},{c:"yellow",l:"Branded Medicine"},{c:"green",l:"Exact Ingredient Match"}].map(({c,l})=>(
                  <div key={l} style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px",fontSize:"12px",color:"var(--text2)"}}>
                    <span className={`alt-tag ${c}`} style={{padding:"2px 8px"}}>{l}</span>
                  </div>
                ))}
              </div>
            </div>
            <div>
              {loading?(
                <div className="loading-overlay"><Spinner/><div className="loading-text">Finding best alternatives...</div></div>
              ):(
                <>
                  <div className="results-header">
                    <div className="results-count">Showing <span>{filtered.length}</span> alternatives</div>
                  </div>
                  {filtered.length===0?
                    <div style={{textAlign:"center",padding:"40px",color:"var(--text2)"}}>No alternatives found. Try a different medicine name.</div>:
                    <div className="alt-cards">
                      {filtered.map((m,i)=>(
                        <div key={m.id} className="alt-card" onClick={()=>setModal(m)}>
                          <div className="alt-rank">#{i+1}</div>
                          <div className="alt-info">
                            <div className="alt-name">{m.name}</div>
                            <div className="alt-company">{m.brand} · {m.company}</div>
                            <div className="alt-tags">
                              <span className={`alt-tag ${m.brand===m.company?"generic":"branded"}`}>{m.brand===m.company?"Generic":"Branded"}</span>
                              <span className="alt-tag match">✓ Ingredient Match</span>
                              <span className="alt-tag" style={{background:"var(--surface2)",color:"var(--text2)"}}>{m.category}</span>
                            </div>
                          </div>
                          <div className="alt-price">
                            <div className="price-num">₹{m.price}</div>
                            <div className="price-unit">per strip</div>
                            <div className="price-badge">Available</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  }
                </>
              )}
            </div>
          </div>
        )}
        {!searched&&(
          <div style={{textAlign:"center",padding:"60px 0"}}>
            <div style={{fontSize:"56px",marginBottom:"16px",animation:"float 3s ease-in-out infinite"}}>💊</div>
            <div style={{fontFamily:"var(--font-head)",fontSize:"18px",fontWeight:"700",marginBottom:"8px"}}>Find the Right Alternative</div>
            <div style={{color:"var(--text2)",fontSize:"14px",marginBottom:"20px"}}>Try searching for popular medicines like Crocin, Amoxicillin, or Omeprazole</div>
            <div style={{display:"flex",gap:"8px",justifyContent:"center",flexWrap:"wrap"}}>
              {["Paracetamol","Amoxicillin","Omeprazole","Cetirizine"].map(s=>(
                <button key={s} className="filter-chip" onClick={()=>{setQuery(s);}} style={{cursor:"pointer"}}>{s}</button>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// DATABASE
// ============================================================
function DatabasePage(){
  const [query,setQuery]=useState("");
  const [category,setCategory]=useState("All");
  const [modal,setModal]=useState(null);
  const filtered=MEDICINE_DB.filter(m=>{
    const q=query.toLowerCase();
    const matchQ=!q||m.name.toLowerCase().includes(q)||m.brand.toLowerCase().includes(q)||m.ingredient.toLowerCase().includes(q)||m.company.toLowerCase().includes(q);
    const matchC=category==="All"||m.category===category;
    return matchQ&&matchC;
  });
  const categoryColors={Analgesic:"#00d4ff",Antibiotic:"#ff4d6d",Antihistamine:"#ffd166",Antidiabetic:"#00e5a0",Antacid:"#a78bfa",Statin:"#fb923c",Antihypertensive:"#34d399",Supplement:"#60a5fa"};
  return(
    <div>
      {modal&&(
        <div className="modal-overlay" onClick={()=>setModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-header">
              <div><div className="modal-title">{modal.name}</div><div style={{color:"var(--text2)",fontSize:"13px",marginTop:"4px"}}>{modal.brand} · {modal.company}</div></div>
              <div className="modal-close" onClick={()=>setModal(null)}>✕</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginBottom:"20px"}}>
              {[{l:"Ingredient",v:modal.ingredient},{l:"Category",v:modal.category},{l:"Form",v:modal.form},{l:"Schedule",v:modal.schedule},{l:"Price",v:"₹"+modal.price},{l:"Status",v:modal.status.toUpperCase()}].map(f=>(
                <div key={f.l} className="detail-item"><div className="detail-label">{f.l}</div><div className="detail-value">{f.v}</div></div>
              ))}
            </div>
            <div className="modal-section"><div className="modal-section-title">Primary Uses</div><div style={{color:"var(--text2)",fontSize:"14px"}}>{modal.uses}</div></div>
            <div className="modal-section">
              <div className="modal-section-title">Active Ingredients</div>
              <div className="ingredient-list">{modal.ingredient.split("+").map(i=><span key={i} className="ingredient-pill">{i.trim()}</span>)}</div>
            </div>
            {modal.alternatives.length>0&&(
              <div className="modal-section">
                <div className="modal-section-title">Known Alternatives</div>
                <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                  {modal.alternatives.map(id=>{const m=getMed(id);return m?<div key={id} style={{fontSize:"13px",color:"var(--cyan)"}}>• {m.name} ({m.brand})</div>:null;})}
                </div>
              </div>
            )}
          </div>
        </div>
      )}
      <div className="page-hero">
        <div className="page-hero-inner">
          <div className="section-tag" style={{marginBottom:"12px"}}>Pharmaceutical Registry</div>
          <div className="page-title">Medicine <span>Database</span></div>
          <div className="page-desc">Browse our verified database of {MEDICINE_DB.length}+ medicines with complete composition and safety data.</div>
        </div>
      </div>
      <div className="page-body">
        <div style={{display:"flex",gap:"12px",marginBottom:"20px",flexWrap:"wrap"}}>
          <input className="search-input" style={{flex:"1",minWidth:"200px"}} placeholder="Search by name, ingredient, brand, company..." value={query} onChange={e=>setQuery(e.target.value)}/>
          <select className="search-input" style={{flex:"0 0 auto",width:"180px"}} value={category} onChange={e=>setCategory(e.target.value)}>
            {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div style={{marginBottom:"16px",fontSize:"14px",color:"var(--text2)"}}>Showing <span style={{color:"var(--text)",fontWeight:"600"}}>{filtered.length}</span> medicines</div>
        <div className="db-table-wrap">
          <table className="db-table">
            <thead>
              <tr>
                <th>Medicine</th><th>Ingredient</th><th>Category</th><th>Form</th><th>Price</th><th>Schedule</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(m=>(
                <tr key={m.id} style={{cursor:"pointer"}} onClick={()=>setModal(m)}>
                  <td><div className="med-name-cell">{m.name}</div><div className="med-company">{m.brand} · {m.company}</div></td>
                  <td style={{color:"var(--text2)",fontSize:"13px"}}>{m.ingredient}</td>
                  <td><span className="category-badge" style={{background:`${categoryColors[m.category]||"#666"}22`,color:categoryColors[m.category]||"var(--text2)",fontSize:"11px",fontWeight:"600",padding:"3px 10px",borderRadius:"99px"}}>{m.category}</span></td>
                  <td style={{color:"var(--text2)",fontSize:"13px"}}>{m.form}</td>
                  <td style={{fontWeight:"600"}}>₹{m.price}</td>
                  <td style={{fontSize:"13px",color:"var(--text2)"}}>{m.schedule}</td>
                  <td><div className="status-dot"><div className={`dot ${m.status}`}/><span style={{fontSize:"13px",color:m.status==="verified"?"var(--green)":m.status==="flagged"?"var(--yellow)":"var(--red)",fontWeight:"600",textTransform:"capitalize"}}>{m.status}</span></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// ALERTS
// ============================================================
function AlertsPage(){
  const [filter,setFilter]=useState("All");
  const filtered=filter==="All"?ALERTS:ALERTS.filter(a=>a.severity===filter.toLowerCase());
  return(
    <div>
      <div className="page-hero">
        <div className="page-hero-inner">
          <div className="section-tag" style={{marginBottom:"12px"}}>Live Safety Feed</div>
          <div className="page-title">Safety <span>Alerts</span></div>
          <div className="page-desc">Real-time alerts on counterfeit medicines, drug recalls, and safety warnings from CDSCO and WHO.</div>
        </div>
      </div>
      <div className="page-body">
        <div style={{display:"flex",gap:"8px",marginBottom:"28px",flexWrap:"wrap"}}>
          {["All","High","Medium","Low"].map(f=>(
            <div key={f} className={`filter-chip ${filter===f?"active":""}`} onClick={()=>setFilter(f)}>{f==="High"?"🚨":f==="Medium"?"⚠️":f==="Low"?"ℹ️":"🔔"} {f}</div>
          ))}
          <div style={{marginLeft:"auto",fontSize:"13px",color:"var(--text3)",display:"flex",alignItems:"center",gap:"6px"}}>
            <div className="dot" style={{background:"var(--green)",animation:"pulse 2s infinite"}}/>
            Live feed · Updated 2 min ago
          </div>
        </div>
        <div className="alerts-list">
          {filtered.map(a=>(
            <div key={a.id} className={`alert-card ${a.severity}`}>
              <div className={`alert-icon ${a.severity}`}>{a.icon}</div>
              <div className="alert-content">
                <div className="alert-header">
                  <div className="alert-title">{a.title}</div>
                  <div className={`alert-severity ${a.severity}`}>{a.severity}</div>
                </div>
                <div className="alert-desc">{a.desc}</div>
                <div className="alert-meta">
                  <span>📍 {a.region}</span>
                  <span>🕐 {a.date}</span>
                  <span>📋 {a.source}</span>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// DASHBOARD
// ============================================================

              <button className="btn-outline" style={{width:"100%",marginTop:"12px",borderColor:"rgba(255,77,109,0.3)",color:"var(--red)"}} onClick={()=>setPage("alerts")}>View Safety Alerts →</button>

// ============================================================
// ROOT APP
// ============================================================
function App(){
  const [user,setUser]=useState(()=>{
    try{const u=localStorage.getItem("mv_session");return u?JSON.parse(u):null;}catch{return null;}
  });
  const [page,setPage]=useState("home");
  const [toast,setToast]=useState(null);

  function handleAuth(u){
    setUser(u);
    localStorage.setItem("mv_session",JSON.stringify(u));
  }
  function handleLogout(){
    setUser(null);
    localStorage.removeItem("mv_session");
    setPage("home");
  }

  if(!user) return <AuthPage onAuth={handleAuth}/>;

  return(
    <div className="app">
      <div className="grid-bg"/>
      <div className="orb orb1"/><div className="orb orb2"/><div className="orb orb3"/>
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      <Navbar user={user} page={page} setPage={setPage} onLogout={handleLogout}/>
      <div className="main-content">
        {page==="home"&&<HomePage setPage={setPage}/>}
        {page==="verify"&&<VerifyPage/>}
        {page==="alternatives"&&<AlternativesPage/>}
        {page==="database"&&<DatabasePage/>}
        {page==="alerts"&&<AlertsPage/>}
        {page==="dashboard"&&<DashboardPage user={user} setPage={setPage}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
